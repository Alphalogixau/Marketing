  Paste into index.html alongside the existing cards. The markup matches the
  hub's own structure exactly: a.tool > span.new-badge + div.icon > svg +
  h3 + p.tagline + div.foot > span.host + span.cta-btn-big.

  Two ways to give it a destination:

  1. RECOMMENDED — create a Static Web App for the Marketing repo and use its
     hostname. Azure then also builds a preview environment per pull request,
     so the card can point at the live PR preview. Your tools SWA already
     proves the Azure side works: tools.alphalogix.com.au returns 302 to
     /.auth/login/aad exactly as its staticwebapp.config.json specifies.

  2. Copy this repo's built `out/` into alphalogix-tools under /web-preview/
     and set href="/web-preview/". If you do this, note three things:
       - rebuild with basePath and assetPrefix set to '/web-preview', or the
         absolute /_next/* asset paths will 404
       - add "/web-preview/*" to navigationFallback.exclude in
         staticwebapp.config.json, or deep links fall through to the hub's
         index.html
       - the copy goes stale on every Marketing push unless it is re-synced
